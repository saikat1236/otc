<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#151d2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  <!-- Candle 1 -->
  <line x1="140" y1="180" x2="140" y2="340" stroke="#00e676" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="210" width="40" height="100" rx="8" fill="#00e676"/>
  <!-- Candle 2 -->
  <line x1="220" y1="120" x2="220" y2="380" stroke="#ff5252" stroke-width="6" stroke-linecap="round"/>
  <rect x="200" y="160" width="40" height="160" rx="8" fill="#ff5252"/>
  <!-- Candle 3 (Hero) -->
  <line x1="300" y1="100" x2="300" y2="360" stroke="#00e676" stroke-width="6" stroke-linecap="round"/>
  <rect x="280" y="130" width="40" height="190" rx="8" fill="#00e676"/>
  <!-- Lightning bolt overlay -->
  <path d="M 330 180 L 260 280 L 310 280 L 270 380 L 370 260 L 315 260 Z" fill="url(#gold)" filter="drop-shadow(0 0 16px rgba(255,215,0,0.6))"/>
  <!-- Brand text -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">TRADENEXT</text>
</svg>
