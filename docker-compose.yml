version: '3.8'

services:
  # TradeNext OTC Fullstack Application (Express + Socket.io + React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otc-trading-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/otc_trade}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    networks:
      - otc-network

  # Optional local MongoDB (Used if MONGODB_URI points to localhost/mongo)
  mongo:
    image: mongo:7.0
    container_name: otc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otc-network

networks:
  otc-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
